<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Off Road - Ironman Ivan Stewart Tribute</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
canvas {
  display: block;
  border: 3px solid #c8891a;
  box-shadow: 0 0 40px #c8891a55, 0 0 80px #c8891a22;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c" width="900" height="620"></canvas>
<script>
// ============================================================
// SUPER OFF ROAD — Tribute to Ivan "Ironman" Stewart's 1989 Classic
// Single-file isometric arcade racer
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Isometric transform: compress Y axis to create depth illusion
const ISO_A = 0.70;  // Y scale
const ISO_B = 93;    // Y screen offset (centers the view)
// world_y → screen_y via: screen_y = world_y * ISO_A + ISO_B

// ============================================================
// INPUT
// ============================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let mx = 0, my = 0, mclick = false;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mx = (e.clientX - r.left) * (W / r.width);
  my = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  mx = (e.clientX - r.left) * (W / r.width);
  my = (e.clientY - r.top) * (H / r.height);
  mclick = true;
});

// ============================================================
// AUDIO (Web Audio API)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, type, dur, vol = 0.3) {
  try {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function playEngine(speed) {
  try {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth';
    o.frequency.value = 80 + speed * 120;
    g.gain.value = 0.04;
    o.start(); o.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}
}
function sfxNitro() { playTone(440, 'square', 0.3, 0.2); playTone(660, 'square', 0.2, 0.15); }
function sfxCrash() { playTone(120, 'sawtooth', 0.4, 0.4); playTone(80, 'sawtooth', 0.5, 0.3); }
function sfxMud() { playTone(200, 'triangle', 0.3, 0.2); }
function sfxJump() { playTone(300, 'sine', 0.1, 0.2); playTone(600, 'sine', 0.2, 0.15); }
function sfxWin() { [523, 659, 784, 1047].forEach((f,i) => setTimeout(() => playTone(f,'sine',0.3,0.25), i*150)); }
function sfxBeep(f) { playTone(f, 'square', 0.15, 0.3); }

// ============================================================
// GAME STATE
// ============================================================
let STATE = 'menu';   // menu | shop | race | results | gameover
let money = 250;
let raceNum = 0;
let finishOrder = [];
let lastPrize = 0;

const PRIZES    = [600, 350, 150, 50];
const ENTRY_FEE = [0, 75, 100, 150, 200, 300];
const LAPS      = 3;

// ============================================================
// UPGRADES
// ============================================================
const UPG = {
  engine:     { level:0, max:5, costs:[100,175,250,375,500], name:'ENGINE',     icon:'⚙', desc:'TOP SPEED' },
  tires:      { level:0, max:5, costs:[80, 130,190,280,400], name:'TIRES',      icon:'◎', desc:'HANDLING' },
  suspension: { level:0, max:5, costs:[65, 110,165,240,350], name:'SUSPENSION', icon:'↕', desc:'JUMP LIFT' },
  nitro:      { level:0, max:5, costs:[50, 90, 140,210,300], name:'NITRO',      icon:'⚡', desc:'BOOST CANS' },
};

// ============================================================
// MATH HELPERS
// ============================================================
function lerp(a,b,t){ return a + (b-a)*t; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function dist(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function angleDiff(a,b){
  let d = b - a;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}
function catmull(p0,p1,p2,p3,t){
  return 0.5*(2*p1 + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t*t + (-p0+3*p1-3*p2+p3)*t*t*t);
}
function smoothLoop(raw, n){
  const m = raw.length, pts = [];
  for(let i=0;i<n;i++){
    const t  = (i/n)*m;
    const i0 = Math.floor(t)%m;
    const i1 = (i0+1)%m;
    const i2 = (i0+2)%m;
    const im = (i0-1+m)%m;
    const f  = t - Math.floor(t);
    pts.push({
      x: catmull(raw[im].x,raw[i0].x,raw[i1].x,raw[i2].x,f),
      y: catmull(raw[im].y,raw[i0].y,raw[i1].y,raw[i2].y,f),
    });
  }
  return pts;
}
function buildBounds(cl, width){
  const n=cl.length, inner=[], outer=[];
  for(let i=0;i<n;i++){
    const p = cl[(i-1+n)%n], q = cl[(i+1)%n];
    const dx=q.x-p.x, dy=q.y-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=-dy/len, ny=dx/len;
    const w = typeof width==='function' ? width(i/n) : width;
    inner.push({x:cl[i].x+nx*w/2, y:cl[i].y+ny*w/2});
    outer.push({x:cl[i].x-nx*w/2, y:cl[i].y-ny*w/2});
  }
  return {inner,outer};
}

// ============================================================
// TRACK LIBRARY  (5 tracks, increasing difficulty)
// ============================================================
function makeTrack(rawPts, smoothN, width, mudCount, jumpCount, rockCount){
  const cl = smoothLoop(rawPts, smoothN);
  const {inner, outer} = buildBounds(cl, width);
  return { cl, inner, outer, mudCount, jumpCount, rockCount };
}

const TRACK_DEFS = [
  // Track 1 — Dirt Oval
  () => makeTrack([
    {x:450,y:160},{x:650,y:170},{x:780,y:230},{x:820,y:310},{x:790,y:420},
    {x:680,y:490},{x:450,y:510},{x:220,y:490},{x:110,y:420},{x:80,y:310},
    {x:120,y:200},{x:250,y:160}
  ], 80, 82, 3, 2, 1),

  // Track 2 — Twisted Canyon
  () => makeTrack([
    {x:200,y:130},{x:450,y:100},{x:720,y:150},{x:820,y:270},{x:750,y:390},
    {x:580,y:450},{x:450,y:480},{x:320,y:450},{x:200,y:500},{x:120,y:400},
    {x:80,y:280},{x:130,y:170}
  ], 90, 74, 4, 3, 2),

  // Track 3 — Snake Gulch
  () => makeTrack([
    {x:150,y:150},{x:350,y:110},{x:550,y:130},{x:720,y:100},{x:820,y:200},
    {x:800,y:340},{x:680,y:430},{x:500,y:470},{x:350,y:430},{x:220,y:500},
    {x:120,y:420},{x:80,y:300},{x:110,y:200}
  ], 96, 70, 5, 4, 3),

  // Track 4 — Rockridge
  () => makeTrack([
    {x:250,y:110},{x:480,y:90}, {x:700,y:120},{x:820,y:220},{x:840,y:360},
    {x:760,y:470},{x:580,y:530},{x:420,y:550},{x:260,y:520},{x:140,y:440},
    {x:80,y:320},{x:100,y:200}
  ], 100, 66, 6, 5, 4),

  // Track 5 — Death Valley Sprint
  () => makeTrack([
    {x:200,y:120},{x:420,y:80}, {x:660,y:100},{x:800,y:190},{x:830,y:330},
    {x:800,y:460},{x:660,y:540},{x:480,y:570},{x:300,y:555},{x:150,y:480},
    {x:80,y:360},{x:90,y:230}
  ], 108, 64, 8, 6, 6),
];

// Place obstacles along a track's centerline
function spawnObstacles(track){
  const obs = [], cl = track.cl, n = cl.length;
  function place(type, count){
    let placed = 0, attempts = 0;
    while(placed < count && attempts < count*10){
      attempts++;
      const idx = 4 + Math.floor(Math.random()*(n-8));
      const pt  = cl[idx];
      const t   = idx/n * Math.PI*2;
      const off = (Math.random()-0.5)*28;
      const ox  = pt.x + Math.cos(t+1.57)*off;
      const oy  = pt.y + Math.sin(t+1.57)*off;
      // Avoid clustering
      if(obs.some(o => dist(o.x,o.y,ox,oy)<50)) continue;
      obs.push({ x:ox, y:oy, type, r: type==='mud'?26:type==='jump'?20:11 });
      placed++;
    }
  }
  place('mud',  track.mudCount);
  place('jump', track.jumpCount);
  place('rock', track.rockCount);
  return obs;
}

// ============================================================
// VEHICLE
// ============================================================
const TRUCK_COLORS = [
  { body:'#e03030', cab:'#b01010', wheel:'#1a1a1a', name:'YOU'   },
  { body:'#2a6fe8', cab:'#1a4faa', wheel:'#1a1a1a', name:'JAKE'  },
  { body:'#28b428', cab:'#1a881a', wheel:'#1a1a1a', name:'TOMMY' },
  { body:'#d4a800', cab:'#a07800', wheel:'#1a1a1a', name:'BILLY' },
];

class Vehicle {
  constructor(x, y, angle, colorIdx, isPlayer) {
    this.x = x; this.y = y;
    this.angle = angle;
    this.speed = 0;
    this.colors = TRUCK_COLORS[colorIdx];
    this.isPlayer = isPlayer;
    this.name = TRUCK_COLORS[colorIdx].name;

    // Physics
    this.vx = 0; this.vy = 0;
    this.w = 17; this.h = 26;

    // Airtime / jump
    this.z = 0; this.vz = 0;
    this.inAir = false;

    // Effects
    this.stunTime  = 0;
    this.mudTime   = 0;
    this.nitroTime = 0;

    // Race state
    this.lap = -1;
    this.wpIdx = 0;
    this.progress = 0;
    this.finished = false;
    this.finishT = 0;
    this.place = 0;

    // Nitro cans for player
    this.nitroCans = 0;

    // AI
    this.aiWp = 0;
    this.aiErr = (Math.random()-0.5)*0.06;

    // Skid trail
    this.skid = [];

    // Engine sound throttle
    this._engTick = 0;
  }

  /* --- derived stats --- */
  get maxSpeed()   { return 2.8 + (this.isPlayer ? UPG.engine.level : raceNum*0.18 + Math.random()*0.2) * 0.38; }
  get accel()      { return 0.075 + (this.isPlayer ? UPG.engine.level * 0.008 : 0.04); }
  get turnRate()   { return 0.043 + (this.isPlayer ? UPG.tires.level * 0.004 : 0.005); }
  get jumpBoost()  { return 1.0  + (this.isPlayer ? UPG.suspension.level * 0.22 : 0.4); }

  /* --- update --- */
  update(track, obstacles, dt) {
    if (this.finished) return;

    // Stun
    if (this.stunTime > 0) { this.stunTime -= dt; this.speed *= 0.88; }
    else if (this.mudTime > 0) { this.mudTime -= dt; }
    else {
      if (this.isPlayer) this._playerControl(dt);
      else               this._aiControl(track.cl, dt);
    }

    // Clamp speed
    const topSpd = this.maxSpeed * (this.mudTime>0 ? 0.4 : 1);
    this.speed   = clamp(this.speed, 0, topSpd);
    this.speed  *= 0.978; // drag

    // Nitro
    if (this.nitroTime > 0) {
      this.nitroTime -= dt;
      this.speed = Math.min(this.speed + 0.25, this.maxSpeed * 1.7);
    }

    // Movement
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.x += this.vx;
    this.y += this.vy;

    // Jump physics
    if (this.inAir) {
      this.vz -= 0.6 * dt;
      this.z  += this.vz;
      if (this.z <= 0) { this.z = 0; this.vz = 0; this.inAir = false; }
    }

    // Skid trail
    if (this.speed > 1.2 && !this.inAir) {
      this.skid.push({ x:this.x, y:this.y, a:this.angle, age:0 });
      if (this.skid.length > 80) this.skid.shift();
    }
    this.skid.forEach(s => s.age++);
    this.skid = this.skid.filter(s => s.age < 60);

    // Obstacle check
    this._checkObs(obstacles);

    // Waypoint / lap check
    this._checkWaypoints(track.cl);

    // Engine sound (player only)
    if (this.isPlayer) {
      this._engTick += dt;
      if (this._engTick > 0.05) { playEngine(this.speed / this.maxSpeed); this._engTick = 0; }
    }
  }

  _playerControl(dt) {
    const fwd = keys['ArrowUp']    || keys['KeyW'];
    const rev = keys['ArrowDown']  || keys['KeyS'];
    const lft = keys['ArrowLeft']  || keys['KeyA'];
    const rgt = keys['ArrowRight'] || keys['KeyD'];
    const bst = keys['Space']      || keys['ShiftLeft'];

    if (fwd) this.speed += this.accel;
    else if (rev) this.speed = Math.max(0, this.speed - this.accel * 0.6);
    else this.speed *= 0.97;

    const speedFrac = clamp(this.speed / this.maxSpeed, 0.1, 1);
    if (lft) this.angle -= this.turnRate * speedFrac;
    if (rgt) this.angle += this.turnRate * speedFrac;

    if (bst && this.nitroTime <= 0 && this.nitroCans > 0) {
      this.nitroCans--;
      this.nitroTime = 1.6 + UPG.nitro.level * 0.35;
      sfxNitro();
    }
  }

  _aiControl(cl, dt) {
    const target = cl[this.aiWp];
    const dx = target.x - this.x, dy = target.y - this.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    const tAngle = Math.atan2(dy, dx);
    let diff = angleDiff(this.angle, tAngle) + this.aiErr;

    const turn = 0.038 + Math.random()*0.008;
    this.angle += Math.sign(diff) * Math.min(Math.abs(diff), turn);
    this.speed  += 0.062 + Math.random()*0.015;

    if (d < 32) this.aiWp = (this.aiWp + 1) % cl.length;

    // Occasional AI nitro
    if (Math.random() < 0.003 && this.nitroTime <= 0) this.nitroTime = 0.8 + Math.random()*0.6;
  }

  _checkObs(obstacles) {
    for (const o of obstacles) {
      const d = dist(this.x, this.y, o.x, o.y);
      if (d < o.r + 10) {
        if (o.type === 'mud') {
          if (this.mudTime <= 0) { sfxMud(); }
          this.mudTime = 1.8;
        } else if (o.type === 'jump' && !this.inAir) {
          this.inAir = true;
          this.vz = 4.5 * this.jumpBoost;
          this.speed *= 1.25;
          sfxJump();
        } else if (o.type === 'rock') {
          this.stunTime = 1.0;
          this.speed   *= 0.2;
          this.angle   += Math.PI + (Math.random()-0.5)*0.8;
          sfxCrash();
        }
      }
    }
  }

  _checkWaypoints(cl) {
    const n   = cl.length;
    const nxt = (this.wpIdx + 1) % n;
    const wp  = cl[nxt];
    if (dist(this.x, this.y, wp.x, wp.y) < 38) {
      this.wpIdx = nxt;
      if (nxt === 0) {
        this.lap++;
        if (this.isPlayer && this.lap === 0) sfxBeep(880);
      }
      this.progress = this.lap + nxt / n;
    }
  }

  /* --- draw --- */
  draw() {
    const sy = iso(this.y);

    // Shadow (when in air)
    if (this.z > 2) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(this.x, sy, this.w, this.h * 0.35 * ISO_A, this.angle + Math.PI/2, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    const drawY = sy - this.z * ISO_A * 0.8;

    ctx.save();
    ctx.translate(this.x, drawY);
    ctx.rotate(this.angle + Math.PI/2);

    // Wheels (back)
    ctx.fillStyle = this.colors.wheel;
    ctx.fillRect(-this.w/2-4, this.h/2-9, 5, 8);
    ctx.fillRect( this.w/2-1, this.h/2-9, 5, 8);

    // Wheel shine
    ctx.fillStyle = '#555';
    ctx.fillRect(-this.w/2-3, this.h/2-8, 3, 6);
    ctx.fillRect( this.w/2,   this.h/2-8, 3, 6);

    // Body
    ctx.fillStyle = this.colors.body;
    ctx.beginPath();
    ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 3);
    ctx.fill();

    // Body highlight
    ctx.fillStyle = lighten(this.colors.body, 40);
    ctx.fillRect(-this.w/2+2, -this.h/2+2, this.w-4, this.h*0.55-2);

    // Cab roof
    ctx.fillStyle = this.colors.cab;
    ctx.beginPath();
    ctx.roundRect(-this.w/2+2, -this.h/2+2, this.w-4, this.h*0.52, 2);
    ctx.fill();

    // Windshield
    ctx.fillStyle = 'rgba(180,220,255,0.8)';
    ctx.fillRect(-this.w/2+3, -this.h/2+3, this.w-6, 7);

    // Windshield glare
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(-this.w/2+4, -this.h/2+4, 4, 2);

    // Front wheels
    ctx.fillStyle = this.colors.wheel;
    ctx.fillRect(-this.w/2-4, -this.h/2+2, 5, 8);
    ctx.fillRect( this.w/2-1, -this.h/2+2, 5, 8);

    // Wheel shine
    ctx.fillStyle = '#555';
    ctx.fillRect(-this.w/2-3, -this.h/2+3, 3, 6);
    ctx.fillRect( this.w/2,   -this.h/2+3, 3, 6);

    // Nitro exhaust flame
    if (this.nitroTime > 0) {
      ctx.fillStyle = '#ff8800';
      ctx.beginPath();
      ctx.moveTo(-5, this.h/2);
      ctx.lineTo(0,  this.h/2 + 10 + Math.random()*6);
      ctx.lineTo(5,  this.h/2);
      ctx.fill();
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(-3, this.h/2);
      ctx.lineTo(0,  this.h/2 + 6 + Math.random()*4);
      ctx.lineTo(3,  this.h/2);
      ctx.fill();
    }

    // Mud splatter tint
    if (this.mudTime > 0) {
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#6B4226';
      ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }
}

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${clamp(r+amt,0,255)},${clamp(g+amt,0,255)},${clamp(b+amt,0,255)})`;
}

// ============================================================
// RACE ENGINE
// ============================================================
let track      = null;
let obstacles  = [];
let vehicles   = [];
let player     = null;
let raceTime   = 0;
let countdown  = 3;
let cdTimer    = 1.0;
let raceGoing  = false;
let raceEnding = false;
let endTimer   = 0;

function initRace() {
  const def = TRACK_DEFS[Math.min(raceNum, TRACK_DEFS.length-1)];
  track     = def();
  obstacles = spawnObstacles(track);
  finishOrder = [];

  const cl   = track.cl;
  const s0   = cl[0], s1 = cl[1];
  const sa   = Math.atan2(s1.y-s0.y, s1.x-s0.x);
  const perpX = -Math.sin(sa), perpY = Math.cos(sa);

  vehicles = [];
  for (let i = 0; i < 4; i++) {
    const row = Math.floor(i/2), col = (i%2===0 ? -0.5 : 0.5);
    const sx  = s0.x + col*perpX*30 - Math.cos(sa)*row*40;
    const sy  = s0.y + col*perpY*30 - Math.sin(sa)*row*40;
    const v   = new Vehicle(sx, sy, sa, i, i===0);
    v.aiWp    = 0;
    v.lap     = -1;
    v.wpIdx   = 0;
    vehicles.push(v);
    if (i===0) player = v;
  }

  player.nitroCans = 2 + UPG.nitro.level;
  raceTime  = 0;
  countdown = 3;
  cdTimer   = 1.0;
  raceGoing = false;
  raceEnding= false;
  endTimer  = 0;
}

function updateRace(dt) {
  if (!raceGoing) {
    cdTimer -= dt;
    if (cdTimer <= 0) {
      cdTimer = 1.0;
      countdown--;
      if (countdown > 0) sfxBeep(440 + (3-countdown)*220);
      if (countdown <= 0) { raceGoing = true; sfxBeep(880); }
    }
    return;
  }
  raceTime += dt;

  for (const v of vehicles) {
    v.update(track, obstacles, dt);
    if (!v.finished && v.lap >= LAPS) {
      v.finished = true;
      v.finishT  = raceTime;
      v.place    = finishOrder.length + 1;
      finishOrder.push(v);
      if (v.isPlayer) { const pr = PRIZES[Math.min(v.place-1,3)]; money += pr; lastPrize = pr; sfxWin(); }
    }
  }

  // Auto-finish AI if player done, or end after 120s
  if ((player.finished || raceTime > 120) && !raceEnding) {
    // Rank remaining by progress
    vehicles.filter(v=>!v.finished).sort((a,b)=>b.progress-a.progress).forEach(v=>{
      v.finished=true; v.place=finishOrder.length+1; finishOrder.push(v);
    });
    if (!player.finished) {
      const pr = PRIZES[Math.min(player.place-1,3)]; money += pr; lastPrize = pr;
    }
    raceEnding = true;
    endTimer   = 2.5;
  }

  if (raceEnding) {
    endTimer -= dt;
    if (endTimer <= 0) STATE = 'results';
  }
}

// ============================================================
// ISO HELPERS
// ============================================================
function iso(wy) { return wy * ISO_A + ISO_B; }

function isoPath(pts) {
  ctx.beginPath();
  pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x, iso(p.y)) : ctx.lineTo(p.x, iso(p.y)));
  ctx.closePath();
}

// ============================================================
// RENDERING
// ============================================================

/* --- BACKGROUND & TRACK --- */
function renderBackground() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, iso(0));
  sky.addColorStop(0, '#1a0f02');
  sky.addColorStop(1, '#3d1e05');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, iso(0));

  // Ground gradient
  const gnd = ctx.createLinearGradient(0, iso(0), 0, H);
  gnd.addColorStop(0, '#1e3a0d');
  gnd.addColorStop(1, '#0d1f07');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, iso(0), W, H - iso(0));
}

function renderTrack() {
  if (!track) return;

  // Outer (dirt) fill
  isoPath(track.outer);
  ctx.fillStyle = '#8B6310';
  ctx.fill();

  // Inner (grass)
  isoPath(track.inner);
  ctx.fillStyle = '#163508';
  ctx.fill();

  // Dirt texture lines
  ctx.save();
  ctx.strokeStyle = '#7a570e';
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.4;
  for (let i = 0; i < track.cl.length; i += 3) {
    const p = track.cl[i], n = track.cl[(i+1)%track.cl.length];
    ctx.beginPath();
    ctx.moveTo(p.x, iso(p.y));
    ctx.lineTo(n.x, iso(n.y));
    ctx.stroke();
  }
  ctx.restore();

  // Track edge lines
  ctx.strokeStyle = '#c8890055';
  ctx.lineWidth = 2;
  isoPath(track.inner); ctx.stroke();
  isoPath(track.outer); ctx.stroke();

  // Start/finish line
  const s0 = track.cl[0], s1 = track.cl[1];
  const sa  = Math.atan2(s1.y-s0.y, s1.x-s0.x);
  const px  = -Math.sin(sa)*44, py = Math.cos(sa)*44;
  const pxI = -Math.sin(sa)*20, pyI = Math.cos(sa)*20;
  for (let i = -4; i < 4; i++) {
    const t = i/4;
    const x1 = s0.x + px*t, y1 = s0.y + py*t;
    const x2 = s0.x + px*(t+0.25), y2 = s0.y + py*(t+0.25);
    ctx.fillStyle = i%2===0 ? '#fff' : '#000';
    ctx.fillRect(x1-5, iso(y1)-4, Math.abs(x2-x1)+5, 8);
  }

  // "START" text
  ctx.save();
  ctx.translate(s0.x, iso(s0.y) - 12);
  ctx.rotate(sa);
  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('START', 0, 0);
  ctx.restore();
}

function renderObstacles() {
  for (const o of obstacles) {
    const sy = iso(o.y);
    ctx.save();
    ctx.translate(o.x, sy);

    if (o.type === 'mud') {
      // Mud pool
      const grad = ctx.createRadialGradient(0,0,0,0,0,o.r);
      grad.addColorStop(0, '#5c3010');
      grad.addColorStop(1, '#3d1e08');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, o.r, o.r * ISO_A, 0, 0, Math.PI*2);
      ctx.fill();
      // Ripple
      ctx.strokeStyle = '#7a4a20';
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.ellipse(0, 0, o.r*0.55, o.r*0.55*ISO_A, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#3d1e08';
      ctx.font = 'bold 7px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('MUD', 0, 2);

    } else if (o.type === 'jump') {
      // Jump ramp
      ctx.fillStyle = '#aaa8a0';
      ctx.beginPath();
      ctx.ellipse(0, 0, o.r, o.r * ISO_A, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#d0cdc0';
      ctx.fillRect(-o.r*0.7, -o.r*0.25, o.r*1.4, o.r*0.5);
      // Arrow
      ctx.fillStyle = '#ff8800';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('↑', 0, 5);

    } else if (o.type === 'rock') {
      // Rock
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(-o.r, o.r*0.4);
      ctx.lineTo(-o.r*0.4, -o.r);
      ctx.lineTo(o.r*0.4, -o.r*0.7);
      ctx.lineTo(o.r, o.r*0.3);
      ctx.closePath();
      ctx.fill();
      // Rock highlight
      ctx.fillStyle = '#707070';
      ctx.beginPath();
      ctx.moveTo(-o.r*0.5, o.r*0.1);
      ctx.lineTo(-o.r*0.2, -o.r*0.6);
      ctx.lineTo(o.r*0.1, -o.r*0.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function renderSkidMarks() {
  for (const v of vehicles) {
    for (const s of v.skid) {
      const alpha = (1 - s.age/60) * 0.35;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#000';
      ctx.fillRect(s.x-1.5, iso(s.y)-1, 3, 2);
      ctx.restore();
    }
  }
}

function renderVehicles() {
  [...vehicles].sort((a,b)=>a.y-b.y).forEach(v=>v.draw());
}

/* --- HUD --- */
function renderHUD() {
  if (!player) return;

  // Top bar
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, 38);

  // Lap
  const playerLap = clamp(player.lap+1, 0, LAPS);
  ctx.fillStyle = '#f5a623';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`LAP: ${playerLap}/${LAPS}`, 12, 25);

  // Time
  const m = Math.floor(raceTime/60).toString().padStart(1,'0');
  const s = (raceTime%60).toFixed(1).padStart(4,'0');
  ctx.fillText(`TIME: ${m}:${s}`, 130, 25);

  // Position
  const sorted = [...vehicles].filter(v=>!v.finished)
    .sort((a,b)=>b.progress-a.progress);
  const pos = finishOrder.indexOf(player)+1 || sorted.indexOf(player)+1+finishOrder.length;
  const posLbl = ['1ST','2ND','3RD','4TH'][pos-1]||'4TH';
  ctx.fillStyle = pos===1 ? '#ffff00' : '#f5a623';
  ctx.fillText(`POS: ${posLbl}`, 310, 25);

  // Money
  ctx.fillStyle = '#44dd44';
  ctx.textAlign = 'right';
  ctx.fillText(`$${money}`, W-12, 25);

  // Bottom bar
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, H-38, W, 38);

  // Speed gauge
  ctx.fillStyle = '#f5a623';
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px Courier New';
  const spd = Math.floor((player.speed/player.maxSpeed)*100);
  ctx.fillText(`SPD: ${spd}%`, 12, H-14);

  // Nitro cans
  ctx.fillText('NITRO:', 160, H-14);
  const totalCans = 2 + UPG.nitro.level;
  for (let i=0; i<totalCans; i++) {
    const bx = 230 + i*22;
    ctx.fillStyle = i < player.nitroCans ? '#00eeff' : '#1a2a33';
    ctx.fillRect(bx, H-28, 16, 12);
    ctx.strokeStyle = '#336677';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, H-28, 16, 12);
  }

  // Nitro active indicator
  if (player.nitroTime > 0) {
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('NITRO BOOST!', W/2, H-14);
  }

  // Controls hint
  ctx.fillStyle = '#555';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText('WASD/↑↓←→ = DRIVE   SPACE = NITRO', W-12, H-14);

  // Countdown
  if (!raceGoing) {
    ctx.save();
    const cdLabel = countdown>0 ? String(countdown) : 'GO!';
    ctx.textAlign = 'center';
    ctx.font = 'bold 96px Courier New';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur  = 40;
    ctx.fillStyle   = '#ffff00';
    ctx.fillText(cdLabel, W/2, H/2 + 40);
    ctx.restore();
  }

  // Mud warning
  if (player.mudTime > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Courier New';
    ctx.fillStyle = '#8B6310';
    ctx.fillText('MUD!', W/2, 65);
    ctx.restore();
  }

  // Jump air indicator
  if (player.inAir) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px Courier New';
    ctx.fillStyle = '#ff8800';
    ctx.fillText('AIR!', W/2, 65);
    ctx.restore();
  }
}

/* --- MENU --- */
function renderMenu() {
  // Dark arena background
  ctx.fillStyle = '#050d02';
  ctx.fillRect(0, 0, W, H);

  // Dirt track preview
  ctx.fillStyle = '#2a1a05';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.55, 310, 160, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1a0e03';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.55, 190, 90, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0d1f07';
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.55, 189, 89, 0, 0, Math.PI*2);
  ctx.fill();

  // Track lines
  ctx.strokeStyle = '#c8891a33';
  ctx.lineWidth = 60;
  ctx.beginPath();
  ctx.ellipse(W/2, H*0.55, 250, 125, 0, 0, Math.PI*2);
  ctx.stroke();

  // Title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff6600';
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = '#ffcc00';
  ctx.font        = 'bold 56px Courier New';
  ctx.fillText('SUPER OFF ROAD', W/2, 72);
  ctx.shadowBlur  = 0;
  ctx.fillStyle   = '#f5a623';
  ctx.font        = 'bold 17px Courier New';
  ctx.fillText('"IRONMAN" IVAN STEWART TRIBUTE', W/2, 102);
  ctx.restore();

  // Decorative trucks
  drawDemoTruck(200, 370, '#e03030', -0.4);
  drawDemoTruck(660, 400, '#2a6fe8',  0.5);
  drawDemoTruck(450, 430, '#28b428', -0.1);

  // Start button
  const btnY = 510;
  const btnHov = Math.abs(mx-W/2)<140 && Math.abs(my-btnY)<22;
  ctx.textAlign = 'center';
  ctx.fillStyle = btnHov ? '#ffff00' : '#f5a623';
  ctx.font      = 'bold 28px Courier New';
  ctx.fillText('[ START RACE ]', W/2, btnY);

  if (btnHov && mclick) { ensureAudio(); initRace(); STATE='race'; sfxBeep(660); }

  ctx.fillStyle = '#555';
  ctx.font      = '12px Courier New';
  ctx.fillText('WASD / ARROW KEYS to drive   •   SPACE for nitro boost', W/2, 548);
  ctx.fillText('Win races, earn cash, upgrade your truck!', W/2, 566);

  // Top racers on-screen
  ctx.fillStyle = '#333';
  ctx.font      = '11px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('▸ 5 TRACKS  ▸ 4 RACERS  ▸ UPGRADE SHOP  ▸ OBSTACLES', 30, H-15);
}

function drawDemoTruck(x, y, color, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(2, 2);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-8,-13,16,26,2); ctx.fill();
  ctx.fillStyle = 'rgba(180,220,255,0.75)';
  ctx.fillRect(-5,-11,10,6);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-11,-10,4,7); ctx.fillRect(7,-10,4,7);
  ctx.fillRect(-11,5,4,7);   ctx.fillRect(7,5,4,7);
  ctx.restore();
}

/* --- SHOP --- */
function renderShop() {
  ctx.fillStyle = '#05080d';
  ctx.fillRect(0, 0, W, H);

  // Header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffcc00';
  ctx.font      = 'bold 40px Courier New';
  ctx.fillText('UPGRADE SHOP', W/2, 52);

  ctx.fillStyle = '#44dd44';
  ctx.font      = 'bold 22px Courier New';
  ctx.fillText(`CASH: $${money}`, W/2, 86);

  const fee = ENTRY_FEE[Math.min(raceNum, ENTRY_FEE.length-1)];
  ctx.fillStyle = '#888';
  ctx.font      = '15px Courier New';
  ctx.fillText(`RACE ${raceNum+1} ENTRY FEE: $${fee}`, W/2, 112);

  // Upgrade cards
  const upgs = Object.entries(UPG);
  const cW=185, cH=170, gap=10;
  const totalW = upgs.length*(cW+gap)-gap;
  const startX = (W-totalW)/2+cW/2;

  upgs.forEach(([key, u], i) => {
    const cx = startX + i*(cW+gap), cy = 275;
    const hov = Math.abs(mx-cx)<cW/2 && Math.abs(my-cy)<cH/2;
    const canBuy = u.level<u.max && money>=u.costs[u.level];

    // Card background
    ctx.fillStyle = hov && canBuy ? '#0d1a0d' : '#090d09';
    ctx.strokeStyle = canBuy ? (hov ? '#44ff44' : '#1e3e1e') : '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(cx-cW/2, cy-cH/2, cW, cH, 8); ctx.fill(); ctx.stroke();

    // Icon + name
    ctx.fillStyle = '#f5a623';
    ctx.font      = 'bold 15px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`${u.icon} ${u.name}`, cx, cy-62);

    ctx.fillStyle = '#aaa';
    ctx.font      = '11px Courier New';
    ctx.fillText(u.desc, cx, cy-44);

    // Level bars
    for (let l=0; l<u.max; l++) {
      const bx = cx - cW/2 + 10 + l*(cW-20)/u.max;
      const bw = (cW-20)/u.max - 3;
      ctx.fillStyle = l<u.level ? '#44ff44' : '#0d1a0d';
      ctx.fillRect(bx, cy-28, bw, 12);
      ctx.strokeStyle = '#1e3e1e';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, cy-28, bw, 12);
    }

    ctx.fillStyle = '#666';
    ctx.font      = '11px Courier New';
    ctx.fillText(`LEVEL ${u.level} / ${u.max}`, cx, cy-5);

    // Buy / maxed
    if (u.level < u.max) {
      ctx.fillStyle = canBuy ? (hov ? '#ffff00':'#44ff44') : '#333';
      ctx.font      = 'bold 14px Courier New';
      ctx.fillText(`BUY  $${u.costs[u.level]}`, cx, cy+38);
      if (hov && mclick && canBuy) { money -= u.costs[u.level]; u.level++; sfxBeep(660); }
    } else {
      ctx.fillStyle = '#ffff00';
      ctx.font      = 'bold 13px Courier New';
      ctx.fillText('MAX', cx, cy+38);
    }
  });

  // Race button
  const btnY = 490;
  const canRace = money >= fee;
  const rHov = Math.abs(mx-W/2)<160 && Math.abs(my-btnY)<24;
  ctx.fillStyle = canRace ? (rHov ? '#ffff00':'#f5a623') : '#444';
  ctx.font      = 'bold 24px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(canRace ? `[ RACE!  -$${fee} ]` : `NEED $${fee-money} MORE`, W/2, btnY);
  if (rHov && mclick && canRace) { money-=fee; initRace(); STATE='race'; sfxBeep(880); }

  // Skip / menu
  const sHov = Math.abs(mx-W/2)<100 && Math.abs(my-540)<18;
  ctx.fillStyle = sHov ? '#ff6666' : '#442222';
  ctx.font      = '15px Courier New';
  ctx.fillText('[ MAIN MENU ]', W/2, 540);
  if (sHov && mclick) { raceNum=0; STATE='menu'; }

  // Truck preview on right
  drawDemoTruck(820, 270, '#e03030', -0.2);
}

/* --- RESULTS --- */
function renderResults() {
  ctx.fillStyle = '#030810';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffcc00';
  ctx.font      = 'bold 44px Courier New';
  ctx.fillText('RACE RESULTS', W/2, 65);

  const posLabels = ['1ST','2ND','3RD','4TH'];
  finishOrder.forEach((v, i) => {
    const y = 130 + i*60;
    const isPly = v.isPlayer;
    ctx.fillStyle = isPly ? '#ffcc00' : (i===0?'#aaa':'#555');
    ctx.textAlign = 'left';
    ctx.font      = isPly ? 'bold 20px Courier New' : '18px Courier New';
    ctx.fillText(`${posLabels[i]}  ${v.name}`, W/2-160, y);
    const pr = PRIZES[Math.min(i,3)];
    ctx.textAlign = 'right';
    ctx.fillStyle = isPly ? '#44dd44' : '#444';
    ctx.fillText(`+$${pr}`, W/2+160, y);
    if (v.finishT) {
      ctx.fillStyle = '#333';
      ctx.font      = '12px Courier New';
      ctx.fillText(`${v.finishT.toFixed(1)}s`, W/2+200, y);
    }
  });

  // Summary
  const pPlace = finishOrder.indexOf(player);
  const msg = pPlace===0 ? 'VICTORY!' : pPlace===1 ? 'RUNNER UP!' : pPlace===2 ? 'THIRD PLACE' : 'LAST PLACE';
  ctx.textAlign = 'center';
  ctx.fillStyle = pPlace===0 ? '#ffcc00' : pPlace<2 ? '#44dd44' : '#888';
  ctx.font      = 'bold 26px Courier New';
  ctx.fillText(msg, W/2, 400);

  ctx.fillStyle = lastPrize>0 ? '#44dd44' : '#888';
  ctx.font      = '20px Courier New';
  ctx.fillText(`YOU EARNED: $${lastPrize}   TOTAL: $${money}`, W/2, 436);

  // Next race button
  const nHov = Math.abs(mx-W/2)<140 && Math.abs(my-500)<24;
  ctx.fillStyle = nHov ? '#ffff00' : '#f5a623';
  ctx.font      = 'bold 26px Courier New';
  ctx.fillText('[ UPGRADE SHOP ]', W/2, 500);
  if (nHov && mclick) { raceNum=Math.min(raceNum+1, TRACK_DEFS.length-1); STATE='shop'; }

  const mHov = Math.abs(mx-W/2)<100 && Math.abs(my-548)<18;
  ctx.fillStyle = mHov ? '#ff8888' : '#442222';
  ctx.font      = '15px Courier New';
  ctx.fillText('[ MAIN MENU ]', W/2, 548);
  if (mHov && mclick) { raceNum=0; STATE='menu'; }
}

/* --- GAME OVER --- */
function renderGameOver() {
  ctx.fillStyle = '#0f0000';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign  = 'center';
  ctx.fillStyle  = '#cc2222';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur  = 40;
  ctx.font        = 'bold 64px Courier New';
  ctx.fillText('GAME OVER', W/2, 220);
  ctx.shadowBlur  = 0;

  ctx.fillStyle = '#666';
  ctx.font      = '20px Courier New';
  ctx.fillText("You can't afford the entry fee!", W/2, 290);
  ctx.fillText(`Races completed: ${raceNum}`, W/2, 325);

  const pHov = Math.abs(mx-W/2)<140 && Math.abs(my-420)<24;
  ctx.fillStyle = pHov ? '#ffff00' : '#f5a623';
  ctx.font      = 'bold 26px Courier New';
  ctx.fillText('[ PLAY AGAIN ]', W/2, 420);
  if (pHov && mclick) {
    money=250; raceNum=0;
    Object.values(UPG).forEach(u=>u.level=0);
    STATE='menu';
  }
}

/* --- RACE OVER BANNER --- */
function renderRaceOverBanner() {
  if (!raceEnding) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, H/2-35, W, 70);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffcc00';
  ctx.font      = 'bold 36px Courier New';
  const pl = finishOrder.indexOf(player)+1;
  const lbl = ['WINNER!!','2ND PLACE','3RD PLACE','4TH PLACE'][pl-1]||'';
  ctx.fillText(lbl, W/2, H/2+14);
  ctx.restore();
}

// ============================================================
// MAIN LOOP
// ============================================================
let last = 0;
function loop(now) {
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;

  ctx.clearRect(0, 0, W, H);

  switch(STATE) {
    case 'menu':
      renderMenu();
      break;
    case 'shop':
      renderShop();
      break;
    case 'race':
      updateRace(dt);
      renderBackground();
      renderTrack();
      renderObstacles();
      renderSkidMarks();
      renderVehicles();
      renderHUD();
      renderRaceOverBanner();
      break;
    case 'results':
      renderResults();
      break;
    case 'gameover':
      renderGameOver();
      break;
  }

  mclick = false;
  requestAnimationFrame(loop);
}

// ============================================================
// BOOT
// ============================================================
// Check for roundRect support
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y); this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w, y+h-r); this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r, y+h); this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x, y+r); this.arcTo(x,y,x+r,y,r);
    this.closePath();
    return this;
  };
}

requestAnimationFrame(loop);
