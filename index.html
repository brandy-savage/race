// ── core constants ────────────────────────────────────────────
const W=1200,H=750;
const CX=600,CY=375;
const OA=440,OB=296;
const IA=252,IB=170;
const MIDA=(OA+IA)/2,MIDB=(OB+IB)/2;
const CL_N=96;
const LAPS=3;
const ACCEL=0.09,MAX_SPD=4.0,DRAG=0.978,TURN=0.044,BRAKEFORCE=0.14;
const SPRITE_SCALE=0.185;

// ── canvas ───────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

// ── input ────────────────────────────────────────────────────
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>keys[e.code]=false);
let mx=0,my=0,mclick=false;
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height);});
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height);mclick=true;});

// ── audio ────────────────────────────────────────────────────
let aCtx=null;
function ensureAudio(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,dur=0.15,vol=0.25,type='square'){
  try{ensureAudio();const o=aCtx.createOscillator(),g=aCtx.createGain();
  o.connect(g);g.connect(aCtx.destination);o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,aCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+dur);
  o.start();o.stop(aCtx.currentTime+dur);}catch(_){}
}
let engTick=0;
function sfxEngine(s,dt){engTick-=dt;if(engTick>0)return;engTick=0.06;
  try{ensureAudio();const o=aCtx.createOscillator(),g=aCtx.createGain();
  o.connect(g);g.connect(aCtx.destination);o.type='sawtooth';
  o.frequency.value=55+s*120;g.gain.value=0.025;o.start();o.stop(aCtx.currentTime+0.07);}catch(_){}}
function sfxNitro(){beep(420,0.25,0.18);setTimeout(()=>beep(660,0.2,0.14),100);}
function sfxCrash(){beep(90,0.45,0.32,'sawtooth');}
function sfxMud(){beep(160,0.3,0.13,'triangle');}
function sfxJump(){beep(330,0.1,0.16,'sine');setTimeout(()=>beep(580,0.18,0.12,'sine'),90);}
function sfxTurbo(){beep(550,0.07,0.22,'sine');setTimeout(()=>beep(880,0.14,0.18,'sine'),55);setTimeout(()=>beep(1100,0.12,0.14,'sine'),110);}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.28),i*130));}
function sfxCountdown(n){beep(n>0?440:880,0.2,0.3);}
let bgMusic=null;
function startBgMusic(){
  if(!bgMusic){bgMusic=new Audio('pixel_sprint.mp3');bgMusic.loop=true;bgMusic.volume=0.35;}
  if(bgMusic.paused)bgMusic.play().catch(()=>{});
}
function stopBgMusic(){if(bgMusic){bgMusic.pause();bgMusic.currentTime=0;}}
// start music on first user gesture — browsers block autoplay before interaction
(function(){function onFirst(){startBgMusic();window.removeEventListener('click',onFirst);window.removeEventListener('keydown',onFirst);}
window.addEventListener('click',onFirst);window.addEventListener('keydown',onFirst);}());

// ── sprites ──────────────────────────────────────────────────
const CAR_CELLS=[{col:0,row:0},{col:0,row:1},{col:2,row:1},{col:1,row:1}];
let sheet=null;
function loadSheet(b64){
  const img=new Image();
  img.onload=()=>{
    const oc=document.createElement('canvas');oc.width=img.width;oc.height=img.height;
    const ot=oc.getContext('2d');ot.drawImage(img,0,0);
    const id=ot.getImageData(0,0,oc.width,oc.height);const d=id.data;
    for(let i=0;i<d.length;i+=4){if(d[i]===0&&d[i+1]===255&&d[i+2]===255)d[i+3]=0;}
    ot.putImageData(id,0,0);sheet=oc;
  };
  img.src='data:image/png;base64,'+b64;
}
loadSheet(SHEET1_B64);

// ── generative placeholder backgrounds ───────────────────────
const BG_IMGS={};
(function(){
  const base='https://generative-placeholders.stefanbohacek.com/image';
  const screens=[
    ['menu',    'joy-division',   42],
    ['shop',    'mondrian',       71],
    ['results', 'triangles',      55],
    ['gameover','cubic-disarray', 13],
  ];
  for(const[k,style,colors]of screens){
    const img=new Image();
    img.src=`${base}?width=${W}&height=${H}&style=${style}&colors=${colors}`;
    BG_IMGS[k]=img;
  }

  const img=BG_IMGS[key];
  if(!img||!img.complete||!img.naturalWidth)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(img,0,0,W,H);ctx.restore();
}

function drawCarSprite(carIdx,x,y,angle){

  const sw=256,sh=256,sc=SPRITE_SCALE;
  ctx.save();ctx.translate(x,y);ctx.rotate(angle+Math.PI/2);
  ctx.drawImage(sheet,col*sw,row*sh,sw,sh,-sw*sc/2,-sh*sc/2,sw*sc,sh*sc);

}

const ENTRY_FEES=[0,80,120,180,250,350];

// ── upgrades ─────────────────────────────────────────────────
const UPG={
  engine:    {level:0,max:5,costs:[120,190,280,400,560],name:'ENGINE',    desc:'TOP SPEED'},
  tires:     {level:0,max:5,costs:[90, 140,200,290,420],name:'TIRES',     desc:'HANDLING'},
  suspension:{level:0,max:5,costs:[70, 110,170,250,360],name:'SUSPENSION',desc:'JUMP HEIGHT'},

// ── track helpers ─────────────────────────────────────────────
let CL=[];
function buildCL(){CL=[];for(let i=0;i<CL_N;i++){const t=(i/CL_N)*Math.PI*2;CL.push({x:CX+MIDA*Math.cos(t),y:CY+MIDB*Math.sin(t)});}}
buildCL();

function isOnTrack(x,y){const dx=x-CX,dy=y-CY;return (dx*dx)/(OA*OA)+(dy*dy)/(OB*OB)<=1&&(dx*dx)/(IA*IA)+(dy*dy)/(IB*IB)>=1;}

function constrainCar(car){
  if(isOnTrack(car.x,car.y))return false;
  let bd=Infinity,bp=CL[0];
  for(const p of CL){const d=(car.x-p.x)**2+(car.y-p.y)**2;if(d<bd){bd=d;bp=p;}}
  const dx=car.x-bp.x,dy=car.y-bp.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
  car.x=bp.x+dx/dist*75;car.y=bp.y+dy/dist*75;
  // Reflect the inward velocity component off the wall — no speed loss
  const nx=dx/dist,ny=dy/dist;
  const vn=car.vx*nx+car.vy*ny;
  if(vn<0){car.vx-=vn*nx;car.vy-=vn*ny;car.angle=Math.atan2(car.vy,car.vx);car.speed=Math.hypot(car.vx,car.vy);}
  return true;
}

function advanceWaypoint(car){
  const next=(car.wpIdx+1)%CL_N;
  const wp=CL[next];
  const dx=wp.x-car.x,dy=wp.y-car.y;
  if(dx*dx+dy*dy<100*100){
    car.wpIdx=next;
    if(next===0){car.laps++;return true;}
  }
  return false;
}

// ── obstacles ────────────────────────────────────────────────
function obsAt(t,lat,type,r){
  const a=t*Math.PI*2;
  const tx_=-Math.sin(a)*MIDA,ty_=Math.cos(a)*MIDB,tlen=Math.sqrt(tx_*tx_+ty_*ty_)||1;
  const nx=ty_/tlen,ny=-tx_/tlen;
  const angle=Math.atan2(ty_/tlen,tx_/tlen);
  return {x:CX+Math.cos(a)*MIDA+nx*lat,y:CY+Math.sin(a)*MIDB+ny*lat,type,r,angle};
}
const RACE_OBS=[
  [obsAt(0.20,0,'mud',24),obsAt(0.45,0,'turbo',22),obsAt(0.72,10,'jump',20)],
  [obsAt(0.12,0,'turbo',22),obsAt(0.28,-8,'mud',24),obsAt(0.50,12,'mud',24),obsAt(0.68,0,'jump',20),obsAt(0.85,0,'turbo',22)],
  [obsAt(0.08,0,'turbo',22),obsAt(0.22,0,'mud',26),obsAt(0.38,-10,'jump',20),obsAt(0.55,10,'mud',24),obsAt(0.70,0,'turbo',22),obsAt(0.88,0,'jump',20)],
  [obsAt(0.05,0,'turbo',22),obsAt(0.18,5,'mud',26),obsAt(0.32,0,'jump',22),obsAt(0.48,8,'mud',26),obsAt(0.62,0,'turbo',22),obsAt(0.78,0,'jump',20),obsAt(0.92,-5,'mud',24)],
  [obsAt(0.05,0,'turbo',22),obsAt(0.16,10,'mud',26),obsAt(0.27,-10,'jump',22),obsAt(0.38,0,'turbo',22),obsAt(0.50,0,'mud',26),obsAt(0.62,-8,'jump',22),obsAt(0.74,0,'turbo',22),obsAt(0.86,5,'mud',26)],
];
function getObs(){return RACE_OBS[Math.min(raceNum,RACE_OBS.length-1)];}

// ── car class ────────────────────────────────────────────────
class Car{
  constructor(x,y,angle,idx,isPlayer){
    this.x=x;this.y=y;this.angle=angle;this.vx=0;this.vy=0;this.speed=0;
    this.idx=idx;this.isPlayer=isPlayer;
    this.wpIdx=0;this.laps=0;this.progress=0;
    this.finished=false;this.finishTime=0;this.place=0;
    this.stunTime=0;this.mudTime=0;this.nitroTime=0;this.nitroCans=0;
    this.inAir=false;this.z=0;this.vz=0;this._turboPad=null;
    this.skid=[];
    this.aiLookAhead=4+idx;
    this.aiSpeedMult=0.82+idx*0.04+Math.random()*0.06;
  }
  get maxSpd(){return MAX_SPD+(this.isPlayer?UPG.engine.level*0.36:0);}
  get turnRate(){return TURN+(this.isPlayer?UPG.tires.level*0.004:0);}
  get jumpBoost(){return 1+(this.isPlayer?UPG.suspension.level*0.2:0.3);}

  update(dt,obs){
    if(this.finished)return;
    const dtt=Math.min(dt*60,3);
    if(this.stunTime>0){this.stunTime-=dt;this.speed*=Math.pow(0.88,dtt);
      this.vx=Math.cos(this.angle)*this.speed;this.vy=Math.sin(this.angle)*this.speed;
      this._move(dtt);this._updateProgress();return;}
    if(this.isPlayer)this._playerControl(dtt);
    else this._aiControl(dtt);
    if(this.nitroTime>0){this.nitroTime-=dt;this.speed=Math.min(this.speed+0.32*dtt,this.maxSpd*1.65);}
    const top=this.maxSpd*(this.mudTime>0?0.38:this.nitroTime>0?1.65:1);
    this.speed=Math.max(0,Math.min(this.speed,top));
    this.speed*=Math.pow(DRAG,dtt);
    if(this.inAir){this.vz-=0.55*dtt;this.z+=this.vz;if(this.z<=0){this.z=0;this.vz=0;this.inAir=false;}}
    if(this.mudTime>0)this.mudTime-=dt;
    this.vx=Math.cos(this.angle)*this.speed;this.vy=Math.sin(this.angle)*this.speed;
    this._move(dtt);
    constrainCar(this);
    this._checkObs(obs);
    advanceWaypoint(this);
    this.progress=this.laps+this.wpIdx/CL_N;
    if(this.speed>1.0&&!this.inAir){
      this.skid.push({x:this.x,y:this.y,age:0,h:(now_ms*0.06)%360});
      if(this.skid.length>90)this.skid.shift();
    }
    this.skid.forEach(s=>s.age++);
    this.skid=this.skid.filter(s=>s.age<70);
  }
  _move(dtt){this.x+=this.vx*dtt;this.y+=this.vy*dtt;}
  _playerControl(dtt){
    const fwd=keys['ArrowUp']||keys['KeyW'],rev=keys['ArrowDown']||keys['KeyS'];
    const lft=keys['ArrowLeft']||keys['KeyA'],rgt=keys['ArrowRight']||keys['KeyD'];
    const boost=keys['Space']||keys['ShiftLeft'];
    if(fwd)this.speed+=ACCEL*dtt;
    else if(rev)this.speed=Math.max(0,this.speed-BRAKEFORCE*dtt);
    else this.speed*=Math.pow(0.97,dtt);
    const sf=Math.max(this.speed/this.maxSpd,0.12);
    if(lft)this.angle-=this.turnRate*sf*dtt;
    if(rgt)this.angle+=this.turnRate*sf*dtt;
    if(boost&&this.nitroTime<=0&&this.nitroCans>0){this.nitroCans--;this.nitroTime=1.5+UPG.nitro.level*0.35;sfxNitro();}
  }
  _aiControl(dtt){
    const tp=CL[(this.wpIdx+this.aiLookAhead)%CL_N];
    const dx=tp.x-this.x,dy=tp.y-this.y;
    const want=Math.atan2(dy,dx);
    let diff=want-this.angle;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    const steer=Math.max(-1,Math.min(1,diff*2.8));
    const sf=Math.max(this.speed/this.maxSpd,0.2);
    this.angle+=steer*TURN*sf*dtt;
    const throttle=Math.max(0.4,1-Math.abs(diff)*0.6);
    this.speed+=ACCEL*throttle*dtt;
    this.speed=Math.min(this.speed,MAX_SPD*this.aiSpeedMult);
  }
  _checkObs(obs){
    let onTurbo=null;
    for(const o of obs){
      const dx=this.x-o.x,dy=this.y-o.y;
      if(dx*dx+dy*dy<(o.r+12)**2){
        if(o.type==='mud'){if(this.mudTime<=0&&this.isPlayer)sfxMud();this.mudTime=2.0;}
        else if(o.type==='jump'&&!this.inAir){this.inAir=true;this.vz=4.2*this.jumpBoost;this.speed*=1.2;if(this.isPlayer)sfxJump();}
        else if(o.type==='turbo'){onTurbo=o;}
      }
    }
    if(onTurbo&&onTurbo!==this._turboPad){
      this._turboPad=onTurbo;
      this.speed=Math.min(this.speed+this.maxSpd*1.1,this.maxSpd*1.7);
      if(this.isPlayer)sfxTurbo();
    }
    if(!onTurbo)this._turboPad=null;
  }

  draw(){
    // Neon skid marks (rainbow!)
    for(const s of this.skid){
      const a=(1-s.age/70)*0.5;
      ctx.save();ctx.globalAlpha=a;
      ctx.fillStyle=`hsl(${s.h},100%,65%)`;
      ctx.fillRect(s.x-1.5,s.y-1.5,3,3);ctx.restore();
    }
    // Shadow airborne
    if(this.z>2){
      ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#000';
      ctx.beginPath();ctx.ellipse(this.x,this.y,16,8,this.angle,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    // Nitro flame — psychedelic
    if(this.nitroTime>0){
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle+Math.PI/2);
      const h1=(now_ms*0.2)%360,h2=(h1+60)%360;
      ctx.fillStyle=`hsl(${h1},100%,60%)`;
      ctx.beginPath();ctx.moveTo(-6,20);ctx.lineTo(0,34+Math.random()*8);ctx.lineTo(6,20);ctx.fill();
      ctx.fillStyle=`hsl(${h2},100%,80%)`;
      ctx.beginPath();ctx.moveTo(-3,20);ctx.lineTo(0,26+Math.random()*5);ctx.lineTo(3,20);ctx.fill();
      ctx.restore();
    }
    // Car sprite
    drawCarSprite(this.idx,this.x,this.y-this.z,this.angle);
    // Mud aura — toxic green
    if(this.mudTime>0){
      ctx.save();ctx.globalAlpha=Math.min(this.mudTime/2,0.5);
      ctx.fillStyle='#00ff44';
      glow('#00ff44',20);
      ctx.beginPath();ctx.ellipse(this.x,this.y,22,14,this.angle,0,Math.PI*2);ctx.fill();
      noGlow();ctx.restore();
    }
  }
}

// ── race ─────────────────────────────────────────────────────
let cars=[],player=null,raceObs=[];
let raceTime=0,countdown=3,cdTimer=0,raceGoing=false,raceEnding=false,endTimer=0;

function initRace(){
  raceObs=getObs();finishOrder=[];
  const gx=CX+MIDA,gy=CY;
  const starts=[
    {x:gx-22,y:gy+24,a:Math.PI/2,idx:0,isP:true},
    {x:gx+22,y:gy+24,a:Math.PI/2,idx:1,isP:false},
    {x:gx-22,y:gy+48,a:Math.PI/2,idx:2,isP:false},
    {x:gx+22,y:gy+48,a:Math.PI/2,idx:3,isP:false},
  ];
  // Start past the finish line (wpIdx=1) so each return to wp0 counts as one lap.
  // Previously cars started before the line so the first crossing was "free", requiring
  // 4 crossings for 3 laps. Now 3 crossings = 3 laps.
  cars=starts.map(s=>{const c=new Car(s.x,s.y,s.a,s.idx,s.isP);c.wpIdx=1;if(s.isP)c.nitroCans=2+UPG.nitro.level;return c;});
  player=cars[0];
  raceTime=0;countdown=3;cdTimer=1.0;raceGoing=false;raceEnding=false;endTimer=0;
}

function updateRace(dt){
  if(!raceGoing){
    cdTimer-=dt;
    if(cdTimer<=0){cdTimer=1.0;countdown--;sfxCountdown(countdown);if(countdown<=0){raceGoing=true;countdown=0;}}
    return;
  }
  raceTime+=dt;
  for(const c of cars){
    c.update(dt,raceObs);
    if(!c.finished&&c.laps>=LAPS){
      c.finished=true;c.finishTime=raceTime;c.place=finishOrder.length+1;finishOrder.push(c);
      if(c.isPlayer){lastPrize=PRIZES[Math.min(c.place-1,3)];money+=lastPrize;sfxWin();}
    }
  }
  if(player.finished&&!raceEnding){
    [...cars].filter(c=>!c.finished).sort((a,b)=>b.progress-a.progress).forEach(c=>{c.finished=true;c.place=finishOrder.length+1;finishOrder.push(c);});
    raceEnding=true;endTimer=2.8;
  }
  if(raceTime>120&&!raceEnding){
    [...cars].filter(c=>!c.finished).sort((a,b)=>b.progress-a.progress).forEach(c=>{
      c.finished=true;c.place=finishOrder.length+1;
      if(c.isPlayer){lastPrize=PRIZES[Math.min(c.place-1,3)];money+=lastPrize;}
      finishOrder.push(c);
    });
    raceEnding=true;endTimer=2.8;
  }
  if(raceEnding){endTimer-=dt;if(endTimer<=0)STATE='results';}
}

// ── render helpers ────────────────────────────────────────────
function neonRect(x,y,w,h,r,fillC,strokeC,glowC,glowR=14){
  ctx.save();
  glow(glowC||strokeC,glowR);
  ctx.strokeStyle=strokeC;ctx.lineWidth=1.5;
  ctx.fillStyle=fillC;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
  ctx.fill();ctx.stroke();
  noGlow();ctx.restore();
}

// ── render track ─────────────────────────────────────────────
function renderTrack(){
  // Deep space background
  ctx.fillStyle='#040010';ctx.fillRect(0,0,W,H);
  drawStars();

  // Subtle outer nebula glow
  const nbg=ctx.createRadialGradient(CX,CY,IA+10,CX,CY,OA+40);
  nbg.addColorStop(0,'rgba(120,0,255,0.08)');
  nbg.addColorStop(0.5,'rgba(255,0,200,0.05)');
  nbg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=nbg;ctx.fillRect(0,0,W,H);

  // Road surface
  ctx.beginPath();ctx.ellipse(CX,CY,OA,OB,0,0,Math.PI*2);
  ctx.fillStyle='#0a0018';ctx.fill();

  // Road grid lines (neon purple)
  ctx.save();ctx.globalAlpha=0.18;ctx.strokeStyle='#9d00ff';ctx.lineWidth=1;
  for(let i=0;i<CL_N;i+=2){
    const p=CL[i],q=CL[(i+2)%CL_N];
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
  }
  ctx.restore();

  // Inner void
  ctx.beginPath();ctx.ellipse(CX,CY,IA,IB,0,0,Math.PI*2);
  const ivg=ctx.createRadialGradient(CX,CY,0,CX,CY,IA);
  ivg.addColorStop(0,'#080020');ivg.addColorStop(1,'#030012');
  ctx.fillStyle=ivg;ctx.fill();

  // Inner pulse rings
  ctx.save();
  for(let r=0;r<3;r++){
    const phase=(now_ms*0.0012+r*0.4)%1;
    const rA=IA*0.3+IA*0.7*phase,rB=IB*0.3+IB*0.7*phase;
    ctx.globalAlpha=(1-phase)*0.35;
    ctx.strokeStyle=hue(r*120);ctx.lineWidth=1.5;
    glow(hue(r*120),10);
    ctx.beginPath();ctx.ellipse(CX,CY,rA,rB,0,0,Math.PI*2);ctx.stroke();
  }
  noGlow();ctx.restore();

  // Outer neon edge — animated rainbow
  ctx.save();
  glow(hue(0),22);
  ctx.strokeStyle=hue(0);ctx.lineWidth=2.5;
  ctx.beginPath();ctx.ellipse(CX,CY,OA,OB,0,0,Math.PI*2);ctx.stroke();
  noGlow();
  // Inner neon edge — offset hue
  glow(hue(180),18);
  ctx.strokeStyle=hue(180);ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(CX,CY,IA,IB,0,0,Math.PI*2);ctx.stroke();
  noGlow();ctx.restore();

  // Start/finish line — rainbow checkered
  const segments=8,segW=(OA-IA)/segments;
  for(let i=0;i<segments;i++){
    ctx.fillStyle=i%2===0?hue(i*45):'#000';
    glow(hue(i*45),8);
    ctx.fillRect(CX+IA+i*segW,CY-5,segW,10);
    noGlow();
  }

  // START label
  ctx.save();ctx.translate(CX+MIDA,CY-16);
  glow(hue(60),12);ctx.fillStyle=hue(60);
  ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.fillText('START',0,0);
  noGlow();ctx.restore();
}

function renderObs(obs){
  for(const o of obs){
    ctx.save();ctx.translate(o.x,o.y);
    if(o.type==='mud'){
      // Toxic green ooze
      glow('#00ff44',24);
      const g=ctx.createRadialGradient(0,0,0,0,0,o.r);
      g.addColorStop(0,'#00ff44');g.addColorStop(0.5,'#008822');g.addColorStop(1,'#003311');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.ellipse(0,0,o.r,o.r*0.7,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#00ff88';ctx.lineWidth=1;ctx.globalAlpha=0.6;
      ctx.beginPath();ctx.ellipse(0,0,o.r*0.5,o.r*0.35,0,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;noGlow();
      ctx.fillStyle='#000';ctx.font='bold 7px Courier New';ctx.textAlign='center';
      ctx.fillText('MUD',0,2);
    }else if(o.type==='turbo'){
      // Turbo pad — animated flowing chevrons
      const tc=hue(55);
      ctx.save();ctx.rotate(o.angle);
      ctx.fillStyle='rgba(255,220,0,0.10)';
      ctx.beginPath();ctx.ellipse(0,0,o.r,o.r*0.42,0,0,Math.PI*2);ctx.fill();
      glow(tc,28);
      ctx.strokeStyle=tc;ctx.lineWidth=2.5;ctx.lineCap='round';
      const flow=(now_ms*0.004)%1;
      for(let i=0;i<3;i++){
        const phase=((i/3)+flow)%1;
        const xoff=(phase*2-1)*o.r*0.55;
        ctx.globalAlpha=0.35+0.65*Math.abs(Math.sin(phase*Math.PI));
        ctx.beginPath();ctx.moveTo(xoff-7,-7);ctx.lineTo(xoff+7,0);ctx.lineTo(xoff-7,7);ctx.stroke();
      }
      ctx.globalAlpha=1;noGlow();ctx.restore();
    }else if(o.type==='jump'){
      // Hot pink ramp
      const ph=hue(300);
      glow(ph,22);
      ctx.fillStyle='#1a0033';
      ctx.beginPath();ctx.ellipse(0,0,o.r,o.r*0.8,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=ph;ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(0,0,o.r,o.r*0.8,0,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=ph;ctx.font='bold 13px Courier New';ctx.textAlign='center';
      ctx.fillText('↑',0,5);noGlow();
    }
    ctx.restore();
  }
}

// ── HUD ──────────────────────────────────────────────────────
function renderHUD(){
  const H1=hue(0),H2=hue(120),H3=hue(240);

  // Top bar
  ctx.fillStyle='rgba(4,0,16,0.88)';ctx.fillRect(0,0,W,38);
  glow(H1,8);ctx.strokeStyle=H1;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,38);ctx.lineTo(W,38);ctx.stroke();noGlow();

  const pl=player;
  const dispLap=Math.min(pl.laps+1,LAPS);
  glow(H2,10);ctx.fillStyle=H2;ctx.font='bold 15px Courier New';ctx.textAlign='left';
  ctx.fillText('LAP: '+dispLap+'/'+LAPS,12,25);noGlow();

  const mm=Math.floor(raceTime/60),ss=(raceTime%60).toFixed(1).padStart(4,'0');
  glow(H3,10);ctx.fillStyle=H3;ctx.fillText('TIME: '+mm+':'+ss,140,25);noGlow();

  const alive=cars.filter(c=>!c.finished).sort((a,b)=>b.progress-a.progress);
  const pPos=finishOrder.indexOf(pl)+1||alive.indexOf(pl)+1+finishOrder.length;
  const posStr=['1ST','2ND','3RD','4TH'][pPos-1]||'4TH';
  const posH=pPos===1?hue(60):H1;
  glow(posH,10);ctx.fillStyle=posH;ctx.fillText('POS: '+posStr,320,25);noGlow();

  glow(H2,10);ctx.fillStyle=H2;ctx.textAlign='right';ctx.fillText('$'+money,W-12,25);noGlow();

  // Bottom bar
  ctx.fillStyle='rgba(4,0,16,0.88)';ctx.fillRect(0,H-36,W,36);
  glow(H1,8);ctx.strokeStyle=H1;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,H-36);ctx.lineTo(W,H-36);ctx.stroke();noGlow();

  const spd=Math.round((pl.speed/pl.maxSpd)*100);
  glow(H3,8);ctx.fillStyle=H3;ctx.textAlign='left';ctx.font='bold 13px Courier New';
  ctx.fillText('SPD:'+spd+'%',12,H-12);noGlow();

  // Speed bar — gradient
  ctx.fillStyle='#0a0020';ctx.fillRect(80,H-27,120,14);
  const sg=ctx.createLinearGradient(80,0,200,0);
  sg.addColorStop(0,'#9d00ff');sg.addColorStop(0.5,'#ff00ff');sg.addColorStop(1,'#00ffff');
  ctx.fillStyle=sg;ctx.fillRect(80,H-27,Math.min(spd*1.2,120),14);

  // Nitro pips
  glow(H3,8);ctx.fillStyle=H3;ctx.fillText('NITRO:',218,H-12);noGlow();
  const cans=2+UPG.nitro.level;
  for(let i=0;i<cans;i++){
    const pip=i<pl.nitroCans;
    const ph=hue(i*40);
    if(pip){glow(ph,14);}
    ctx.fillStyle=pip?ph:'#0a0022';
    ctx.fillRect(288+i*22,H-28,17,13);
    ctx.strokeStyle=pip?ph:'#220044';ctx.lineWidth=1;
    ctx.strokeRect(288+i*22,H-28,17,13);
    noGlow();
  }

  if(pl.nitroTime>0){
    glow(hue(180),18);ctx.fillStyle=hue(180);ctx.font='bold 14px Courier New';ctx.textAlign='center';
    ctx.fillText('⚡ HYPER BOOST ⚡',W/2,H-12);noGlow();
  }
  if(pl.mudTime>0){
    glow('#00ff44',16);ctx.fillStyle='#00ff44';ctx.textAlign='center';ctx.font='bold 14px Courier New';
    ctx.fillText('☣ TOXIC MUD ☣',W/2,58);noGlow();
  }
  if(pl.inAir){
    glow(hue(300),16);ctx.fillStyle=hue(300);ctx.textAlign='center';ctx.font='bold 14px Courier New';
    ctx.fillText('✦ AIR ✦',W/2,58);noGlow();
  }

  ctx.fillStyle='#333';ctx.font='10px Courier New';ctx.textAlign='right';
  ctx.fillText('WASD/ARROWS=DRIVE  SPACE=NITRO',W-10,H-12);

  // Countdown
  if(!raceGoing){
    ctx.fillStyle='rgba(4,0,16,0.7)';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.textAlign='center';
    const ch=hue(0);glow(ch,50);ctx.fillStyle=ch;
    ctx.font='bold 110px Courier New';
    ctx.fillText(countdown>0?String(countdown):'GO!',W/2,H/2+40);
    noGlow();ctx.restore();
  }

  // Winner banner
  if(raceEnding){
    ctx.fillStyle='rgba(4,0,16,0.75)';ctx.fillRect(0,H/2-40,W,80);
    const bh=hue(60);glow(bh,20);ctx.textAlign='center';ctx.font='bold 38px Courier New';
    const pl2=finishOrder.indexOf(player)+1;
    ctx.fillStyle=bh;
    ctx.fillText(['★ WINNER ★','2ND PLACE','3RD PLACE','LAST PLACE'][Math.min(pl2-1,3)],W/2,H/2+14);
    noGlow();
  }
}

// ── scanline overlay ──────────────────────────────────────────
function renderScanlines(){
  ctx.save();ctx.globalAlpha=0.04;
  for(let y=0;y<H;y+=3){ctx.fillStyle='#000';ctx.fillRect(0,y,W,1);}
  ctx.restore();
}

// ── panel helper ──────────────────────────────────────────────
function panel(x,y,w,h){
  ctx.fillStyle='rgba(4,0,20,0.92)';
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,10);else ctx.rect(x,y,w,h);
  ctx.fill();
  const ph=hue(0);
  glow(ph,12);ctx.strokeStyle=ph;ctx.lineWidth=1.5;
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,10);else ctx.rect(x,y,w,h);
  ctx.stroke();noGlow();
}

// ── UI screens ────────────────────────────────────────────────
function renderMenu(){
  // Deep space bg
  ctx.fillStyle='#020008';ctx.fillRect(0,0,W,H);
  drawBg('menu');
  drawStars();

  // Rotating neon rings
  ctx.save();
  for(let r=0;r<5;r++){
    const t=now_ms*0.0008*(r%2===0?1:-1)+r*0.8;
    const rx=340+r*16,ry=228+r*10;
    glow(hue(r*72),18);
    ctx.strokeStyle=hue(r*72);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(CX,CY,rx,ry,t,0,Math.PI*2);ctx.stroke();
  }
  noGlow();ctx.restore();

  // Inner dark oval fill
  ctx.fillStyle='rgba(4,0,16,0.6)';ctx.beginPath();ctx.ellipse(CX,CY,IA,IB,0,0,Math.PI*2);ctx.fill();

  // Cars rotating on track
  if(sheet){
    for(let i=0;i<4;i++){
      const t=now_ms*0.0008+i*Math.PI/2;
      drawCarSprite(i,CX+MIDA*Math.cos(t),CY+MIDB*Math.sin(t),t+Math.PI/2);
    }
  }

  // Title
  ctx.save();ctx.textAlign='center';
  // Shadow layers
  for(let i=3;i>0;i--){ctx.fillStyle=hue(i*40,100,30+i*10);ctx.font='bold 62px Courier New';ctx.fillText('FRACTAL RIDER',W/2+i,80+i);}
  glow(hue(0),35);ctx.fillStyle=hue(0);ctx.font='bold 62px Courier New';ctx.fillText('FRACTAL RIDER',W/2,80);noGlow();
  glow(hue(120),12);ctx.fillStyle=hue(120);ctx.font='bold 14px Courier New';
  ctx.fillText('PSYCHEDELIC RACING  ✦  HYPERDRIVE EDITION',W/2,108);noGlow();
  ctx.restore();

  // Start button
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(W/2-200,456,400,58,10);else ctx.rect(W/2-200,456,400,58);
  const hov=mx>=W/2-200&&mx<=W/2+200&&my>=456&&my<=514;
  ctx.fillStyle=hov?'rgba(157,0,255,0.3)':'rgba(4,0,16,0.8)';ctx.fill();
  glow(hov?hue(300):hue(0),hov?28:14);
  ctx.strokeStyle=hov?hue(300):hue(0);ctx.lineWidth=1.5;ctx.stroke();noGlow();
  ctx.fillStyle=hov?hue(300):hue(0);ctx.font='bold 26px Courier New';ctx.textAlign='center';
  ctx.fillText('[ ENTER THE FRACTAL ]',W/2,492);
  if(hov&&mclick||keys['Space']){ensureAudio();initRace();STATE='race';startBgMusic();keys['Space']=false;}

  ctx.fillStyle='#554488';ctx.font='12px Courier New';ctx.textAlign='center';
  ctx.fillText('WASD / ARROWS = Drive   SPACE = Nitro Boost',W/2,538);
  ctx.fillText('Race 3 laps · Earn credits · Upgrade your rig',W/2,556);
}

function renderShop(){
  ctx.fillStyle='#020008';ctx.fillRect(0,0,W,H);
  drawBg('shop',0.18);
  drawStars();

  ctx.save();ctx.textAlign='center';
  glow(hue(300),30);ctx.fillStyle=hue(300);ctx.font='bold 38px Courier New';
  ctx.fillText('UPGRADE LAB',W/2,50);noGlow();
  glow(hue(120),14);ctx.fillStyle=hue(120);ctx.font='bold 22px Courier New';
  ctx.fillText('CREDITS: $'+money,W/2,86);noGlow();
  const fee=ENTRY_FEES[Math.min(raceNum,ENTRY_FEES.length-1)];
  ctx.fillStyle='#664488';ctx.font='14px Courier New';
  ctx.fillText('RACE '+(raceNum+1)+' — ENTRY FEE: $'+fee,W/2,110);
  ctx.restore();

  const upgs=Object.entries(UPG);
  const cW=180,cH=168,gap=12;
  const tx=(W-upgs.length*(cW+gap)+gap)/2;
  upgs.forEach(([k,u],i)=>{
    const cx=tx+i*(cW+gap),cy=270,ch=hue(i*90);
    const hov=mx>=cx&&mx<=cx+cW&&my>=cy-cH/2&&my<=cy+cH/2;
    const canBuy=u.level<u.max&&money-u.costs[u.level]>=fee;

    // Card
    ctx.fillStyle=hov&&canBuy?'rgba(80,0,120,0.4)':'rgba(4,0,20,0.85)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy-cH/2,cW,cH,8);else ctx.rect(cx,cy-cH/2,cW,cH);ctx.fill();
    if(canBuy)glow(ch,hov?20:8);
    ctx.strokeStyle=canBuy?ch:'#220033';ctx.lineWidth=1.5;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,cy-cH/2,cW,cH,8);else ctx.rect(cx,cy-cH/2,cW,cH);ctx.stroke();noGlow();

    glow(ch,10);ctx.fillStyle=ch;ctx.font='bold 14px Courier New';ctx.textAlign='center';
    ctx.fillText(u.name,cx+cW/2,cy-56);noGlow();
    ctx.fillStyle='#998877';ctx.font='11px Courier New';ctx.fillText(u.desc,cx+cW/2,cy-39);

    // Level bars
    for(let l=0;l<u.max;l++){
      const bx=cx+8+l*(cW-16)/u.max,bw=(cW-16)/u.max-3;
      if(l<u.level){glow(ch,8);ctx.fillStyle=ch;}else ctx.fillStyle='#0d001a';
      ctx.fillRect(bx,cy-27,bw,11);
      ctx.strokeStyle=l<u.level?ch:'#330055';ctx.lineWidth=1;ctx.strokeRect(bx,cy-27,bw,11);
      noGlow();
    }
    ctx.fillStyle='#664488';ctx.font='11px Courier New';ctx.fillText('LVL '+u.level+'/'+u.max,cx+cW/2,cy-4);

    if(u.level<u.max){
      const bc=canBuy?(hov?hue(60):ch):'#330044';
      if(canBuy)glow(bc,hov?16:8);ctx.fillStyle=bc;ctx.font='bold 13px Courier New';
      ctx.fillText('BUY $'+u.costs[u.level],cx+cW/2,cy+38);noGlow();
      if(hov&&mclick&&canBuy){money-=u.costs[u.level];u.level++;beep(660,0.12,0.2);}
    }else{
      glow(hue(60),10);ctx.fillStyle=hue(60);ctx.font='bold 12px Courier New';ctx.fillText('MAX',cx+cW/2,cy+38);noGlow();
    }
  });

  const canRace=money>=fee;
  const rHov=mx>=W/2-170&&mx<=W/2+170&&my>=476&&my<=516;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-170,476,340,40,8);else ctx.rect(W/2-170,476,340,40);
  ctx.fillStyle=canRace?(rHov?'rgba(157,0,255,0.4)':'rgba(4,0,20,0.8)'):'rgba(20,0,20,0.8)';ctx.fill();
  if(canRace)glow(hue(300),rHov?24:12);
  ctx.strokeStyle=canRace?hue(300):'#330044';ctx.lineWidth=1.5;ctx.stroke();noGlow();
  ctx.fillStyle=canRace?(rHov?hue(60):hue(300)):'#440033';
  ctx.font='bold 22px Courier New';ctx.textAlign='center';
  ctx.fillText(canRace?'[ RACE!  -$'+fee+' ]':'NEED $'+(fee-money)+' MORE',W/2,502);
  if(rHov&&mclick&&canRace){money-=fee;initRace();STATE='race';startBgMusic();beep(880,0.2,0.3);}

  const sHov=mx>=W/2-100&&mx<=W/2+100&&my>=538&&my<=560;
  glow(sHov?'#ff0066':'#440022',sHov?10:0);ctx.fillStyle=sHov?'#ff0066':'#550033';ctx.font='15px Courier New';
  ctx.fillText('[ EXIT TO MENU ]',W/2,553);noGlow();
  if(sHov&&mclick){raceNum=0;STATE='menu';}
}

function renderResults(){
  ctx.fillStyle='#020008';ctx.fillRect(0,0,W,H);
  drawBg('results',0.22);
  drawStars();

  ctx.save();ctx.textAlign='center';
  glow(hue(60),30);ctx.fillStyle=hue(60);ctx.font='bold 42px Courier New';
  ctx.fillText('RACE RESULTS',W/2,62);noGlow();ctx.restore();

  // Results panel
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-200,90,400,240,12);else ctx.rect(W/2-200,90,400,240);
  ctx.fillStyle='rgba(4,0,20,0.9)';ctx.fill();
  const ph=hue(180);glow(ph,12);ctx.strokeStyle=ph;ctx.lineWidth=1.5;ctx.stroke();noGlow();

  const labels=['1ST','2ND','3RD','4TH'];
  finishOrder.forEach((c,i)=>{
    const ip=c.isPlayer,rh=hue(i*90);
    glow(ip?hue(60):rh,ip?12:0);
    ctx.fillStyle=ip?hue(60):(i===0?'#aaa':'#555');
    ctx.textAlign='left';ctx.font=(ip?'bold ':'')+'17px Courier New';
    ctx.fillText(labels[i]+'  '+['YOU','JAKE','TOMMY','BILLY'][c.idx],W/2-180,130+i*52);
    ctx.textAlign='right';ctx.fillStyle=ip?hue(120):'#443355';
    ctx.fillText('+$'+PRIZES[Math.min(i,3)],W/2+180,130+i*52);
    noGlow();
  });

  const pp=finishOrder.indexOf(player);
  const wh=hue(60+pp*40);
  ctx.textAlign='center';
  glow(wh,20);ctx.fillStyle=wh;ctx.font='bold 24px Courier New';
  ctx.fillText(['★ VICTORY ★','RUNNER UP!','3RD PLACE','LAST PLACE'][pp],W/2,395);noGlow();
  glow(hue(120),10);ctx.fillStyle=hue(120);ctx.font='18px Courier New';
  ctx.fillText('EARNED: $'+lastPrize+'   TOTAL: $'+money,W/2,428);noGlow();

  const nHov=mx>=W/2-170&&mx<=W/2+170&&my>=458&&my<=496;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-170,458,340,38,8);else ctx.rect(W/2-170,458,340,38);
  ctx.fillStyle=nHov?'rgba(157,0,255,0.3)':'rgba(4,0,20,0.8)';ctx.fill();
  const nh=hue(300);glow(nh,nHov?20:10);ctx.strokeStyle=nh;ctx.lineWidth=1.5;ctx.stroke();noGlow();
  ctx.fillStyle=nHov?hue(60):nh;ctx.font='bold 22px Courier New';ctx.fillText('[ UPGRADE LAB ]',W/2,484);
  if(nHov&&mclick){raceNum=Math.min(raceNum+1,RACE_OBS.length-1);STATE='shop';}

  const mHov=mx>=W/2-100&&mx<=W/2+100&&my>=515&&my<=537;
  glow(mHov?'#ff0066':'#440022',mHov?10:0);ctx.fillStyle=mHov?'#ff4488':'#553355';ctx.font='15px Courier New';
  ctx.fillText('[ MAIN MENU ]',W/2,530);noGlow();
  if(mHov&&mclick){raceNum=0;STATE='menu';}
}

function renderGameOver(){
  ctx.fillStyle='#020008';ctx.fillRect(0,0,W,H);
  drawBg('gameover',0.25);
  drawStars();
  ctx.save();ctx.textAlign='center';
  glow('#ff0066',50);ctx.fillStyle='#ff0066';ctx.font='bold 64px Courier New';
  ctx.fillText('SIGNAL LOST',W/2,210);noGlow();
  glow(hue(300),16);ctx.fillStyle=hue(300);ctx.font='20px Courier New';
  ctx.fillText('Insufficient credits to re-enter the fractal.',W/2,278);
  ctx.fillStyle=hue(180);ctx.fillText('Races completed: '+raceNum,W/2,312);noGlow();
  const pH=mx>=W/2-160&&mx<=W/2+160&&my>=388&&my<=428;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-160,388,320,40,8);else ctx.rect(W/2-160,388,320,40);
  ctx.fillStyle=pH?'rgba(157,0,255,0.3)':'rgba(4,0,20,0.8)';ctx.fill();
  const gh=hue(0);glow(gh,pH?24:12);ctx.strokeStyle=gh;ctx.lineWidth=1.5;ctx.stroke();noGlow();
  ctx.fillStyle=pH?hue(60):gh;ctx.font='bold 24px Courier New';ctx.fillText('[ REINITIALISE ]',W/2,415);
  if(pH&&mclick){money=250;raceNum=0;Object.values(UPG).forEach(u=>u.level=0);STATE='menu';}
  ctx.restore();
}

// ── main loop ────────────────────────────────────────────────
let last=0;
function loop(ts){
  now_ms=ts;
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  ctx.clearRect(0,0,W,H);

  if(STATE==='race'){
    updateRace(dt);
    renderTrack();
    renderObs(raceObs);
    [...cars].sort((a,b)=>a.y-b.y).forEach(c=>c.draw());
    renderScanlines();
    renderHUD();
    if(player)sfxEngine(player.speed/player.maxSpd,dt);
    if(STATE==='results'){
      const fee=ENTRY_FEES[Math.min(raceNum+1,ENTRY_FEES.length-1)];
      if(money<fee&&money<Math.min(...Object.values(UPG).filter(u=>u.level<u.max).map(u=>u.costs[u.level]),999))
        STATE='gameover';
    }
  }else if(STATE==='menu')renderMenu();
  else if(STATE==='shop')renderShop();
  else if(STATE==='results')renderResults();
  else if(STATE==='gameover')renderGameOver();

  renderScanlines();
  mclick=false;
  requestAnimationFrame(loop);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);
    this.closePath();return this;
  };
}

requestAnimationFrame(loop);
</script>
